# Configuration for scripts/factory.py.
#
# The factory CLI is the only reader of this file. Other documents point
# here instead of restating these values.

schema_version = 1


[project]
# Replace these values when you instantiate the template.
name = "ai-repo-template"
default_branch = "main"
repository = "JPonsa/ai-repo-template"


[check]
# Git ref that local checks compare against. The CLI also falls back to
# main and to HEAD~1 when the ref does not exist.
base = "origin/main"

# Commands run by `factory.py check`, in order. Every command must exit
# zero. Add the project's real test, lint, format, and type checks here.
# Each entry runs through the system shell, in the repository root.
commands = [
  "uv run scripts/factory.py docs",
  "uv run python -m compileall -q scripts",
]

# Paths that count as source. A change to one of these paths requires a
# configured check. An empty command list then fails closed.
source_paths = [
  "src/**",
  "scripts/**",
  "tests/**",
  "*.toml",
  "*.lock",
  "package.json",
  "package-lock.json",
]

# Paths that never count as source, even when a glob above matches them.
# An asterisk also matches a directory separator.
ignored_paths = [
  "*.md",
  "docs/**",
  ".github/**",
]


[risk]
# Ceiling for a low-risk diff. Above either limit, a human approves the
# merge. Counted against the configured base ref.
max_files = 20
max_added_lines = 600

# A change to any of these paths is high risk. Harness paths are always
# high risk, because a change here changes every future change.
protected_paths = [
  ".github/**",
  ".claude/**",
  ".opencode/**",
  "AGENTS.md",
  "CODING_STANDARDS.md",
  "CONTRIBUTING.md",
  "TEMPLATE.md",
  "factory.toml",
  "scripts/factory.py",
  "LICENSE",
  "docs/index.md",
  "Dockerfile*",
  "docker-compose*.yml",
  "infra/**",
  ".env*",
  "**/auth/**",
  "**/security/**",
  "**/migrations/**",
  "pyproject.toml",
  "uv.lock",
  "requirements*.txt",
  "package.json",
  "package-lock.json",
  "pnpm-lock.yaml",
  "yarn.lock",
]


[labels]
# Issue and pull-request labels that the workflow expects to exist.
spec = "spec"
ready_for_agent = "ready-for-agent"
ready_for_human = "ready-for-human"
needs_triage = "needs-triage"
blocked = "blocked"
risk_low = "risk:low"
risk_high = "risk:high"
agent_merge = "agent-merge"


[docs]
# docs/ is an OKF v0.2 bundle. These values are the whole convention.
bundle = "docs"
okf_version = "0.2"
required_fields = ["type"]
types = [
  "decision",
  "concept",
  "runbook",
  "research",
  "metric",
  "retro",
  "playbook",
]
reserved = ["index.md", "log.md", "architectural-overview.md"]


[skills]
# Skills this template owns. They live in .claude/skills/.
local = [
  "verify",
  "security-review",
  "finding-verifier",
  "docs-knowledge",
  "setup-project",
]


[prerequisites]
# Upstream skills are installed globally and never vendored here.
# A missing skill is an install error, not a prompt to reimplement it.
upstream = "mattpocock/skills"
version = "1.3.1"
commit = "5beb35b040e3de97e54fa9e386d7e42d15c295c2"
required = [
  "grill-with-docs",
  "to-spec",
  "to-tickets",
  "implement",
  "tdd",
  "code-review",
  "pr",
  "retro",
  "setup-matt-pocock-skills",
]
optional = [
  "wayfinder",
  "domain-modeling",
  "research",
  "triage",
  "diagnosing-bugs",
  "writing-for-agents",
]
