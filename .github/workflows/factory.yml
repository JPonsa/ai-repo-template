name: factory

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv run scripts/factory.py check --base origin/main

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run scripts/factory.py docs

  risk:
    name: risk gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # The exact PR head, so evidence compares against the right
          # commit, not the CI merge ref.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv run scripts/factory.py risk --base origin/${{ github.base_ref }}
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_PR: ${{ github.event.pull_request.number }}

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks binary runs directly: the wrapper action needs
      # write scopes to comment on pull requests, and this workflow
      # stays read-only.
      - run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --no-banner

  dependencies:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Audit Python dependencies
        if: hashFiles('pyproject.toml', 'uv.lock', 'requirements*.txt') != ''
        run: uvx pip-audit
      - name: Audit Node dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm audit --audit-level=critical
